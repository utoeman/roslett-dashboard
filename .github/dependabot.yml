# Weekly grouped update PRs; security updates arrive immediately.
# "chore(deps):" titles stay out of the changelog.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      kleine-updates:
        update-types: [minor, patch]
    # Major updates come one by one.
    ignore:
      # TypeScript majors need vue-tsc support first; upgrade by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']
