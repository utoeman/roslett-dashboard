# Prueft jeden Push auf main und jeden Pull Request: Lint, Typen, Tests, Build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall fuehrt "nuxt prepare" aus; ohne die erzeugten Typen
      # schlaegt der Typecheck der Web-App fehl.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
