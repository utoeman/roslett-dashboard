# Manual release: checks, version bump, CHANGELOG.md, production migration,
# tag, `production` branch (deployed by Netlify) and GitHub release.
# If a step fails, nothing after it runs and production stays as it was.
# Requires PRODUCTION_DATABASE_URL (Neon, direct connection).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Art des Releases (patch = nur Fehlerbehebungen, minor = neue Funktionen, major = geändertes Verhalten)'
        type: choice
        options: [patch, minor, major]
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Version anheben
        id: version
        run: |
          NEW=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          npm version "$NEW" --no-git-tag-version --workspaces
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "Neue Version: $NEW"

      - name: Changelog schreiben
        run: node scripts/changelog.ts "${{ steps.version.outputs.tag }}" --notes "$RUNNER_TEMP/notes.md"

      - name: Migrationen auf die Live-Datenbank
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret PRODUCTION_DATABASE_URL fehlt – Release abgebrochen, nichts wurde veroeffentlicht."
            exit 1
          fi
          npm run db:migrate

      - name: Release-Commit, Tag und production
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json packages/core/package.json CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          # Atomic: commit and tag land together or not at all.
          git push --atomic origin HEAD:main "$TAG"
          # Fast-forward only.
          git push origin "$TAG^{commit}:refs/heads/production"

      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
